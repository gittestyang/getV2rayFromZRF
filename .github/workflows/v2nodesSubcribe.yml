name: Update V2Ray Nodes

on:
  schedule:
    # 第一次运行：每小时的第 0 分钟 (例如 01:00, 02:00, 03:00)
    - cron: '0 * * * *'
    
    # 第二次运行：每小时的第 20 分钟 (例如 01:20, 02:20, 03:20)
    - cron: '20 * * * *'
    
    # 第三次运行：每小时的第 40 分钟 (例如 01:40, 02:40, 03:40)
    - cron: '40 * * * *'
  workflow_dispatch: # 允许手动触发调试

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 赋予 Action 提交代码的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download nodes data
        run: |
          # 使用 curl 下载内容并保存到临时文件
          URL="https://www.v2nodes.com/subscriptions/country/all/?key=7D9BF79FC9BD6C4"
          curl -sL "$URL" -o temp_nodes.txt
          
          # 如果下载成功（内容不为空），则覆盖旧文件
          if [ -s temp_nodes.txt ]; then
            mv temp_nodes.txt data/v2ray_content.txt
          else
            echo "Download failed or content is empty"
            exit 1
          fi

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查文件是否有变化
          git add data/v2ray_content.txt
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto update nodes: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
